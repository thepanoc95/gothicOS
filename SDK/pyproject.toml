[project]
name = "gothicos-sdk"
version = "1.1.1"
description = "Application SDK and toolchain for the nullkernRT MicroPython microkernel"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
gothicos-sdk = "gothicos_sdk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gothicos_sdk"]

[tool.setuptools.package-data]
gothicos_sdk = ["templates/*"]

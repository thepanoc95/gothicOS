# null_kernel AMD64 QEMU test profile (Limine 12.x syntax).
TIMEOUT: 3
QUIET: no
SERIAL: yes
SERIAL_BAUDRATE: 115200

/gothicOS (0.1.00.1-amd64)
PROTOCOL: limine
KERNEL_PATH: boot():/nk-0.1.00.1-amd64.elf
MODULE_PATH: boot():/initrd.tar # initrd must mount a ext4 filesystem with a MagicFS container! (TODO: Implement MagicFS)
MODULE_PATH: usb:///data/system/initboot.elf # via USB-as-SATA
CMDLINE: root=@/ loglevel=6 mem=128M

/gothicOS (6.6.162-nk)
PROTOCOL: linux
KERNEL_PATH: boot():/vmlinux-6.6.162-nk
MODULE_PATH: boot():/initrd-6.6.162-nk.img
CMDLINE: root=LABEL=rootfs rw init=/lib/init

# @DEBUG_REGION
# KERNEL_PATH: boot():/build/NullKernel/amd64/null_kernel_amd64.elf
# MODULE_PATH: boot():/build/NullKernel/amd64/initrd.tar
# boot.c requests a framebuffer; InterfaceKit claims it when Limine supplies one.
# Optional second module: make the config itself visible at @/ if wanted.
# MODULE_PATH: boot():/limine/limine.conf

# If the boot media places the files directly under /boot instead, use:


# USB stick loading is supported too: point a module at a mass-storage volume
# with Limine's usb:// protocol, e.g.
#   MODULE_PATH: usb:///program.elf
# The NKUSBPRG header on sector 1 and the ELF payload at LBA 2 are consumed by
# the ring 3 USB service / UART loader, not by ring 0.
